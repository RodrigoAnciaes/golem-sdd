# A fonte é o frontmatter de docs/licoes/*.md. `--conferir` falha se divergirem.
licoes:
  conferir-e-agir-em-chamadas-separadas:
    area: "processo"
    tipo: "armadilha"
    data: "2026-11-06"
    gatilho: "conferência e ação na mesma chamada de ferramenta (encadeadas com && ou ;) ou em chamadas paralelas da mesma mensagem"
    gatilhos: ["\\bgh\\s+pr\\s+merge\\b", "\\bgit\\s+(push|merge)\\b", "\\bgit\\s+ls-remote\\b.*(&&|;)"]
    arquivo: docs/licoes/conferir-e-agir-em-chamadas-separadas.md
  frontmatter-invalido-some-com-o-agente-sem-aviso:
    area: "processo"
    tipo: "armadilha"
    data: "2026-11-13"
    gatilho: "a fase 1 reescreveu a description do revisor.md com um ': ' no meio, e numa sessão nova o agente revisor não existia mais"
    gatilhos: ["\\.claude/agents/[^/]+\\.md$", "/SKILL\\.md$"]
    arquivo: docs/licoes/frontmatter-invalido-some-com-o-agente-sem-aviso.md
  o-grep-do-git-for-windows-aborta-com-i-e-varios-e:
    area: "processo"
    tipo: "erro-de-diagnostico"
    data: "2026-11-13"
    gatilho: "a implementar-fase passou a mandar buscar lições com grep -il, e uma sessão rodou grep -il -e python -e teste"
    gatilhos: ["(?<!git )\\bgrep\\b[^|;&\\n]*\\s-e\\s[^|;&\\n]*\\s-e\\s", "stackdump"]
    arquivo: docs/licoes/o-grep-do-git-for-windows-aborta-com-i-e-varios-e.md
  o-windows-muda-o-que-o-sh-recebe-do-python:
    area: "processo"
    tipo: "armadilha"
    data: "2026-11-12"
    gatilho: "testes do gancho.sh que rodam o sh do Git Bash pelo subprocess do Python, no Windows"
    gatilhos: ["\\bPROGRAMFILES\\b", "(^|/)\\.claude/tests/test_(gancho|codex)\\.py$"]
    arquivo: docs/licoes/o-windows-muda-o-que-o-sh-recebe-do-python.md
  sem-python-no-path-nao-e-maquina-sem-python:
    area: "processo"
    tipo: "erro-de-diagnostico"
    data: "2026-11-12"
    gatilho: "no Windows, o gancho avisou 'nenhum Python 3.8+ encontrado' em toda ação, e o agente concluiu que a máquina não tinha Python"
    gatilhos: ["\\b(where(\\.exe)?|which|type|command\\s+-v|get-command)\\s+(python3?|py|claude)\\b", "(^|/)gancho-falhas\\.log\\b", "\\bwinget\\s+install\\b.*\\bpython"]
    arquivo: docs/licoes/sem-python-no-path-nao-e-maquina-sem-python.md
  suite-verde-so-vale-com-a-linha-de-resumo:
    area: "processo"
    tipo: "armadilha"
    data: "2026-11-06"
    gatilho: "rodar a suíte com o -q do arquivo de configuração somado ao -q da linha de comando, ou num ambiente sem a variável ou o dado que alguns testes exigem"
    gatilhos: ["\\bpytest\\b", "\\bnpm\\s+(run\\s+)?test\\b", "\\bmake\\s+test", "(^|/)(pytest\\.ini|pyproject\\.toml|setup\\.cfg|tox\\.ini)$"]
    arquivo: docs/licoes/suite-verde-so-vale-com-a-linha-de-resumo.md
  trocar-o-localappdata-nao-esconde-o-python-do-agente:
    area: "processo"
    tipo: "premissa-falsa"
    data: "2026-11-13"
    gatilho: "um teste manual da skill diagnostico: abrir o Claude Code com o LOCALAPPDATA numa pasta vazia, para ver o caminho de uma máquina sem Python"
    gatilhos: ["\\bLOCALAPPDATA=\\S", "\\$env:LOCALAPPDATA\\s*=", "\\bwinpty\\b"]
    arquivo: docs/licoes/trocar-o-localappdata-nao-esconde-o-python-do-agente.md
